name: Dependency Security Audit
on:
  push:
    branches: [main]
    paths:
      - 'source/package*.json'
      - 'pos-source/package*.json'
      - '.github/workflows/dependency-audit.yml'
  pull_request:
    paths:
      - 'source/package*.json'
      - 'pos-source/package*.json'
  schedule:
    - cron: '13 3 * * 1'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        directory: [source, pos-source]
    defaults:
      run:
        working-directory: ${{ matrix.directory }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: ${{ matrix.directory }}/package-lock.json
      - name: Audit locked dependencies for high or critical vulnerabilities
        run: npm audit --audit-level=high
